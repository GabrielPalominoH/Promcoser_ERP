<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1322"/>
      <stop offset="0.45" stop-color="#16304f"/>
      <stop offset="0.78" stop-color="#3d4f66"/>
      <stop offset="1" stop-color="#b8743f"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.72" cy="0.86" r="0.45">
      <stop offset="0" stop-color="#f0a65a" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#d98a45" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#d98a45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="plano" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8fb3e6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="planoMayor" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#8fb3e6" stroke-opacity="0.12" stroke-width="1.2"/>
    </pattern>
    <!-- celosía del mástil de la grúa -->
    <pattern id="celosia" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0L24 24M24 0L0 24M0 0H24" stroke="#0b111b" stroke-width="2.2" fill="none"/>
    </pattern>
    <pattern id="celosiaH" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 22L11 0L22 22" stroke="#0b111b" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="ventanas" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="8" height="10" fill="#f3c27a" fill-opacity="0.5"/>
    </pattern>
    <pattern id="ventanasApagadas" width="18" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="8" height="10" fill="#9fb4cc" fill-opacity="0.12"/>
    </pattern>
    <pattern id="franjas" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="28" fill="#e0a43a"/>
      <rect x="14" width="14" height="28" fill="#141a22"/>
    </pattern>
  </defs>

  <!-- cielo, cuadrícula de plano y resplandor -->
  <rect width="1600" height="1000" fill="url(#cielo)"/>
  <rect width="1600" height="1000" fill="url(#plano)"/>
  <rect width="1600" height="1000" fill="url(#planoMayor)"/>
  <rect width="1600" height="1000" fill="url(#sol)"/>

  <!-- cotas de plano (detalle técnico) -->
  <g stroke="#8fb3e6" stroke-opacity="0.25" fill="none" stroke-width="1.2">
    <path d="M120 140H520M120 132V148M520 132V148"/>
    <path d="M1380 120V420M1372 120H1388M1372 420H1388"/>
    <circle cx="1210" cy="190" r="46"/>
    <path d="M1164 190H1256M1210 144V236"/>
  </g>
  <g fill="#8fb3e6" fill-opacity="0.35" font-family="Consolas, monospace" font-size="16">
    <text x="290" y="128">25.00 m</text>
    <text x="1396" y="275">h = 42.50</text>
    <text x="1180" y="262">EJE B-3</text>
  </g>

  <!-- ciudad de fondo -->
  <g fill="#22344c">
    <rect x="0" y="640" width="120" height="360"/>
    <rect x="130" y="580" width="90" height="420"/>
    <rect x="230" y="660" width="140" height="340"/>
    <rect x="1240" y="600" width="110" height="400"/>
    <rect x="1360" y="660" width="90" height="340"/>
    <rect x="1460" y="560" width="140" height="440"/>
  </g>
  <g>
    <rect x="130" y="590" width="90" height="300" fill="url(#ventanasApagadas)"/>
    <rect x="1460" y="575" width="140" height="300" fill="url(#ventanas)" opacity="0.55"/>
    <rect x="1240" y="615" width="110" height="260" fill="url(#ventanasApagadas)"/>
  </g>

  <!-- edificio terminado (izquierda) -->
  <rect x="400" y="470" width="230" height="530" fill="#18263a"/>
  <rect x="412" y="485" width="206" height="440" fill="url(#ventanas)" opacity="0.8"/>
  <rect x="400" y="462" width="230" height="10" fill="#101a29"/>

  <!-- edificio en construcción: estructura de pórticos -->
  <g>
    <rect x="700" y="380" width="420" height="620" fill="#14202f" fill-opacity="0.55"/>
    <g fill="#0d1520">
      <rect x="700" y="380" width="14" height="620"/>
      <rect x="800" y="380" width="14" height="620"/>
      <rect x="900" y="380" width="14" height="620"/>
      <rect x="1000" y="380" width="14" height="620"/>
      <rect x="1106" y="380" width="14" height="620"/>
      <rect x="700" y="380" width="420" height="12"/>
      <rect x="700" y="480" width="420" height="12"/>
      <rect x="700" y="580" width="420" height="12"/>
      <rect x="700" y="680" width="420" height="12"/>
      <rect x="700" y="780" width="420" height="12"/>
      <rect x="700" y="880" width="420" height="12"/>
    </g>
    <!-- pisos inferiores ya cerrados -->
    <rect x="714" y="692" width="392" height="308" fill="#1a2a3e"/>
    <rect x="720" y="700" width="380" height="180" fill="url(#ventanas)" opacity="0.45"/>
    <!-- arriostres -->
    <g stroke="#0d1520" stroke-width="5">
      <path d="M814 392L900 480M914 392L1000 480M814 492L900 580M1014 492L1106 580"/>
    </g>
    <!-- andamio -->
    <g stroke="#3a4a5e" stroke-width="3">
      <path d="M1130 480V1000M1170 480V1000M1130 480H1170M1130 560H1170M1130 640H1170M1130 720H1170M1130 800H1170M1130 880H1170"/>
      <path d="M1130 480L1170 560M1130 560L1170 640M1130 640L1170 720M1130 720L1170 800M1130 800L1170 880"/>
    </g>
  </g>

  <!-- grúa torre principal -->
  <g>
    <rect x="955" y="120" width="34" height="880" fill="#e0a43a"/>
    <rect x="955" y="120" width="34" height="880" fill="url(#celosia)"/>
    <!-- cabina -->
    <rect x="938" y="150" width="68" height="40" rx="4" fill="#d29433"/>
    <rect x="946" y="158" width="26" height="18" fill="#9fc2e6" fill-opacity="0.7"/>
    <!-- pluma y contrapluma -->
    <rect x="560" y="120" width="720" height="22" fill="#e0a43a"/>
    <rect x="560" y="120" width="720" height="22" fill="url(#celosiaH)"/>
    <rect x="1190" y="142" width="80" height="44" fill="#4a5566"/>
    <!-- punta y tirantes -->
    <path d="M972 60L972 120" stroke="#e0a43a" stroke-width="12"/>
    <path d="M972 62L580 122M972 62L1270 122" stroke="#c99036" stroke-width="3"/>
    <!-- carro, cable y carga -->
    <rect x="640" y="142" width="34" height="12" fill="#2b3442"/>
    <path d="M657 154V470" stroke="#1a2230" stroke-width="2.5"/>
    <path d="M647 470H667L662 486H652Z" fill="#2b3442"/>
    <g>
      <path d="M657 486L612 520M657 486L702 520" stroke="#1a2230" stroke-width="2"/>
      <rect x="600" y="520" width="114" height="22" fill="#5d6b7e"/>
      <rect x="600" y="520" width="114" height="5" fill="#7d8b9e"/>
    </g>
    <!-- baliza -->
    <circle cx="972" cy="58" r="5" fill="#ff4d4d"/>
  </g>

  <!-- grúa secundaria lejana -->
  <g opacity="0.55">
    <rect x="260" y="300" width="18" height="700" fill="#c99036"/>
    <rect x="260" y="300" width="18" height="700" fill="url(#celosia)"/>
    <rect x="120" y="300" width="380" height="12" fill="#c99036"/>
    <rect x="120" y="300" width="380" height="12" fill="url(#celosiaH)"/>
    <path d="M269 260V300M269 262L130 302M269 262L490 302" stroke="#b38030" stroke-width="2"/>
    <path d="M420 312V520" stroke="#1a2230" stroke-width="1.5"/>
    <circle cx="269" cy="258" r="3.5" fill="#ff4d4d"/>
  </g>

  <!-- terreno, cerco de obra y barrera -->
  <rect x="0" y="930" width="1600" height="70" fill="#0b1018"/>
  <g fill="#121924">
    <path d="M0 930L1600 930L1600 944L0 944Z"/>
  </g>
  <rect x="80" y="900" width="300" height="18" fill="url(#franjas)"/>
  <rect x="96" y="918" width="8" height="18" fill="#2a3240"/>
  <rect x="356" y="918" width="8" height="18" fill="#2a3240"/>
  <rect x="1250" y="905" width="260" height="16" fill="url(#franjas)"/>
  <rect x="1264" y="921" width="8" height="14" fill="#2a3240"/>
  <rect x="1488" y="921" width="8" height="14" fill="#2a3240"/>
  <!-- conos -->
  <g fill="#e07a2f">
    <path d="M520 935L530 905L540 935Z"/>
    <path d="M560 935L570 905L580 935Z"/>
  </g>
  <g fill="#f3f3f3" fill-opacity="0.8">
    <rect x="524" y="918" width="12" height="4"/>
    <rect x="564" y="918" width="12" height="4"/>
  </g>
</svg>
